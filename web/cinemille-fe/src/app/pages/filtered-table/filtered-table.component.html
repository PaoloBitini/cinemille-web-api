<div class="mat-elevation-z8 d-flex flex-column full-width-flex d-flex flex-column">
    <table mat-table [dataSource]="dataSource" class="full-width-flex">

        @for(column of columns ; track column){
        <ng-container [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef>{{ column | titlecase}}</th>
            <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
        </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>

    <mat-paginator [length]="page.totalElements" [pageSizeOptions]="pageSizeOptions" [pageSize]="defaultPageSize"
        showFirstLastButtons>
    </mat-paginator>
</div>
