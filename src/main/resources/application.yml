#==========================================================
#= CINEMILLE API - Versione Base
#==========================================================
server:
  port: 8080 
  error:
    path: /error
    whitelabel:
      enabled: false
spring:
#==========================================================
#= PARAMETRI DBMS POSTGRESQL 
#==========================================================
  sql:
    init:
      mode: always
      platform: postgres
  datasource:
    password: postgres123!?
    url: jdbc:postgresql://localhost:5433/cinemille
    username: postgres
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  application:
    name: CineMille
